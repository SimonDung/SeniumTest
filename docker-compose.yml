version: "3"
services:
  selenium-hub:
    image: selenium/hub:latest
    container_name: selenium-hub
    ports:
      - "4444:4444"

  chrome:
    image: selenium/node-chrome:latest
    shm_size: '2gb'
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_VNC_ENABLED=true # Enables live browser viewing

  chrome-video:
    image: selenium/video:latest
    depends_on:
      - chrome
    volumes:
      - ./target/videos:/videos # Saves recorded MP4 files to your local project folder
    environment:
      - DISPLAY_CONTAINER_NAME=chrome
      - FILE_NAME=test_execution.mp4

  firefox:
    image: selenium/node-firefox:latest
    shm_size: '2gb'
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
